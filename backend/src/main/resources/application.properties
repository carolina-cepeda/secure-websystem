server.port=8080

# Modo de seguridad: "open" (sin auth, para fases iniciales) o "jwt" (resource server de Auth0).
app.security.mode=jwt

# Configuración OAuth 2.0 Resource Server (Auth0). Rellenar para modo jwt.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://YOUR_TENANT.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://enterprise-risk-api}

# Orígenes exactos permitidos para llamar a la API desde un navegador.
app.cors.allowed-origins=http://localhost:5173,https://YOUR-SUBDOMAIN.duckdns.org
